<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pomodoro</title>

   <!--Téléchargement police GoogleFonts titre-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+AR+Guides&display=swap" rel="stylesheet">  
    
    <!--Téléchargement police GoogleFonts texte de motivation-->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

    <!--Téléchargement police GoogleFonts texte classique-->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!--lien vers la page CSS-->
     <link rel="stylesheet" href="./style.css">
</head>

<!------------------------------------------------------------------------------------------------------------------>

<body class="fond-body">
    <!--Barre de navigation-->
                                    <!--AJOUTER LES ICONES USER MENU BURGER-->
    <nav class="menu">
        <a href="">accueil</a>
        <a href="">mon agenda</a>
        <a href="">mes tâches en cours</a>
        <a href="">historique</a>
    </nav>
    <header>
        <!--Titre principal-->
        <h1 class="titre">pomodoro</h1>
    </header>

    <!--Panneau vertical gauche-->
    <aside>
        <h2 class="titre-aside">tâches du jour</h2>
        <!--Liste à cocher: Tâches dynamiques -->
        <ul>
            <li>
                <input type="checkbox" id="tache-1">
                <label for="tache-1">Créer les fichiers de base</label>
            </li>            
            <li>
                <input type="checkbox" id="tache-2">
                <label for="tache-2">Ajouter la structure</label>
            </li>
            <li>
                <input type="checkbox" id="tache-3">
                <label for="tache-3">Créer le compteur</label>   
            </li>
        </ul>              
    </aside>

    <main>
        <!--Affichage de la tâche en cours -->
        <p id="explication-tache">Aucune tâche sélectionnée</p>
        <!--Indication phase concernée: travail-pause-->
        <p id="phase">Travail</p>

     <section>   
         <!--chronométre-->
        <div class="compteur">
            <div class="cadre" id="dizaine-minutes">1</div>
            <div class="cadre" id="unite-minutes">2</div>
            <div class="cadre">:</div>
            <div class="cadre" id="dizaine-secondes">3</div> 
            <div class="cadre" id="unite-secondes">0</div> 
            </div>
            <!--Boutons-->
        <div class="boutons">
            <button type="button" id="btn-demarrer">DEMARRER</button>
            <button type="button" id="btn-pause">PAUSE</button>
            <button type="button" id="btn-reinitialiser">REINITIALISER</button>
        </div>
    </section>




        
    </main>
  
    



    <script src="./script.js"></script>
</body>
</html>
