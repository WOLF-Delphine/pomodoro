<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pomodoro</title>
   <!--Téléchargement police GoogleFonts titre-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    link href="https://fonts.googleapis.com/css2?family=Playwrite+AR+Guides&display=swap" rel="stylesheet">

    <!--lien vers la page CSS-->
     <link rel="stylesheet" href="./style.css">
</head>

<body class="fond-body">
    <header>
        <h1 class="titre">pomodoro</h1>
        <!--Phrase dynamique qui changera chaque jour-->
        <h2 id="phrase-motivation">Phrase du jour </h2>
    </header>
    
    <aside>
        <h2>Tâches du jour</h2>
        <!--Tâches dynamiques qui changera réguliérement, en fonction des tâches cochées-->
        <ul>
            <li>
                <input type="checkbox" id="tache-1">
                <label for="tache-1">Créer les fichiers de base</label>
            </li>            
            <li>
                <input type="checkbox" id="tache-2">
                <label for="tache-2">Ajouter la structure</label>
            </li>
            <li>
                <input type="checkbox" id="tache-3">
                <label for="tache-3">Créer le compteur</label>   
            </li>
        </ul>              
    </aside>

   
    <main>
        <p id="explication_tache">Paragraphe expliquant la tâche en cours et l indication de la phrase???</p>
         <!--chronométre-->
        <div id="unité-minutes"></div>
        <div id="dizaine-minutes"></div>
        <div>:</div>
        <div id="unité-secondes"></div> 
        <div id="dizaine-secondes"></div> 
        
        <!--Boutons-->
        <button>DEMARRER</button>
        <button>PAUSE</button>
        <button>REINITIALISER</button>
    </main>
  
    



    <script src="./script.js"></script>
</body>
</html>
